<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="shell.js"></script>
<style>
.g1{display:grid;grid-template-columns:1fr 1fr 300px;gap:12px;margin-bottom:20px}
.nc{padding:16px 16px 12px;position:relative;display:flex;flex-direction:column;gap:8px;height:138px}
.nc .ask{font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.nc .who{font-size:12px;color:var(--ink2)}.nc .who b{color:var(--ink);font-weight:600}
.nc .act{margin-top:auto;display:flex;align-items:center;gap:8px}
.today{padding:6px 14px;height:138px;display:flex;flex-direction:column;justify-content:center}
.today .r{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center;padding:9px 0}.today .r+.r{border-top:1px solid var(--line)}
.today .t{font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1}.today .t small{display:block;font-size:12px;font-weight:500;color:var(--ink3);margin-top:3px;letter-spacing:0}
.today b{font-weight:600;font-size:14px;display:block}
.g2{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.task{overflow:hidden;height:266px;display:flex;flex-direction:column}
.task .cover{height:156px;position:relative}
.task .cover .chip{position:absolute;left:8px;bottom:8px;background:rgba(15,15,17,.72);color:#fff;backdrop-filter:blur(8px)}
.task .b{padding:10px 12px 11px;display:flex;flex-direction:column;gap:5px;flex:1}
.task .t{font-size:14px;font-weight:600}.task .next{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .steps{margin-top:auto}
.g3{display:grid;grid-template-columns:repeat(4,1fr) 300px;gap:12px}
.circ{padding:12px;height:120px;display:flex;flex-direction:column;gap:7px}
.circ .h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}.circ .h svg{color:var(--ink2)}
.circ .s{font-size:12px;color:var(--ink2);line-height:1.3;flex:1}.circ .f{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3)}
.heat{padding:12px 16px;height:120px;display:flex;gap:14px;align-items:center}
.hm{display:grid;grid-template-columns:repeat(12,10px);grid-auto-rows:11px;gap:3px}.hm i{border-radius:3px;background:var(--ink)}
</style>
<body><main>
<div class="top"><h1>Home</h1><span class="sub">Tuesday 10 November</span><span class="sp"></span><div class="search" id="s"></div></div>
<h2><i class="dot need"></i>Needs you <span>2</span></h2><div class="g1" id="g1"></div>
<h2>Happening now <span>3 working · 1 scheduled</span><a>All tasks</a></h2><div class="g2" id="g2"></div>
<h2>Circles<a>People map</a></h2><div class="g3" id="g3"></div>
<div class="recent"><b>Recently</b><span>Portfolio files organised · 24 m</span><span>University brief updated · 1 h</span><span>Dinner reminder set · 3 h</span><a>Activity</a></div>
</main>
<script>shell('home');s.innerHTML=ic('search')+'Search people, circles and tasks<kbd>⌘F</kbd>';
const need=(a,n,c,ask,task,t)=>`<div class="card nc"><div class="row who">${av(a,22)}<span><b>${n}</b> · ${c}</span><span class="sp"></span><span class="dim">${t}</span></div><div class="ask">${ask}</div><div class="act"><span class="chip">${ic('grid',12)}${task}</span><span class="sp"></span><span class="btn">Later</span><span class="btn pri">Review</span></div></div>`;
g1.innerHTML=need(2,'Maya Rao','Design Collective','Choose the poster layout before 4 PM','Open studio','12 m')+need(5,'Isha Sen','University','Six survey questions revised — approve to send','Research proposal','34 m')+
`<div class="card today"><div class="r"><div class="t">17:00<small>Today</small></div><div><b>Saturday dinner</b><span class="meta">Dot reminds you to check the menu</span></div></div><div class="r"><div class="t">18:00<small>Thu</small></div><div><b>Workshop room</b><span class="meta">Waiting for Nina's confirmation</span></div></div></div>`;
const task=(p,t,c,ai,next,d,n,st)=>`<div class="card task"><div class="cover" style="background-image:url(assets/p${p}.jpg)"><span class="chip">${st?ic('cal',12)+st:'<i class="dot live"></i>'+ai+' working'}</span></div><div class="b"><div class="t">${t}</div><div class="meta">${c}</div><div class="next">${next}</div>${steps(d,n,!st)}</div></div>`;
g2.innerHTML=task(3,'Reading group notes','University','Codex','Comparing notes from 3 chats',2,4)+task(7,'Portfolio review','Design Collective','Claude Code','Checking the project summaries',4,7)+task(11,'Mum’s birthday trip','Family','Dot','Collecting dates from everyone',1,5)+task(9,'Saturday dinner','Family','','Table for six at 7:30 PM',2,3,'Sat 14 Nov');
const circ=(i,n,s,a,c)=>`<div class="card circ"><div class="h">${ic(i)}${n}</div><div class="s">${s}</div><div class="f">${stack(a,18)}<span>${c} people</span></div></div>`;
g3.innerHTML=circ('cap','University','Survey questions need you',[1,4,6],148)+circ('house','Family','Dinner this Saturday',[8,10,12],6)+circ('heart','Close people','Quiet today',[3,13,14],8)+circ('bag','Collective','Poster choice due today',[2,7,15],58)+
`<div class="card heat"><div class="hm">${Array.from({length:84},(_,k)=>`<i style="opacity:${[.1,.16,.28,.5,.8,1][(k*7+k%5*3+(k>60?3:0))%6]}"></i>`).join('')}</div><div><div class="num">1,284</div><div class="lab">messages · 7 days</div><div class="num" style="margin-top:8px">86</div><div class="lab">AI actions</div></div></div>`;
</script></body>
