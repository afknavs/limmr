<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="790" viewBox="0 0 1040 790" role="img" aria-labelledby="title desc">
  <title id="title">Limmr architecture</title>
  <desc id="desc">Local AI clients authenticate on port 18800. Remote clients use HTTPS and OAuth on port 18801. The Swift app controls the Go engine. Reads pass permission checks; sends wait for approval on the Mac before reaching WhatsApp. Stores remain on the Mac.</desc>
  <style>
    svg { color-scheme: light dark; }
    .bg { fill: #ffffff; }
    .box { fill: #f5f5f5; stroke: #686868; stroke-width: 1.3; }
    .boundary { fill: none; stroke: #858585; stroke-width: 1.2; stroke-dasharray: 6 5; }
    text { fill: #242424; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; }
    .heading { font-size: 22px; font-weight: 600; }
    .label { font-size: 15px; fill: #505050; }
    .wire { fill: none; stroke: #686868; stroke-width: 1.6; marker-end: url(#arrow); }
    .arrow { fill: #686868; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #171717; }
      .box { fill: #252525; stroke: #b5b5b5; }
      .boundary { stroke: #a0a0a0; }
      text { fill: #eeeeee; }
      .label { fill: #c5c5c5; }
      .wire { stroke: #b5b5b5; }
      .arrow { fill: #b5b5b5; }
    }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M 0 0 L 10 5 L 0 10 Z"/></marker></defs>
  <path class="bg" d="M 0 0 H 1040 V 790 H 0 Z"/>
  <text x="40" y="43" class="heading">Limmr</text>
  <text x="40" y="70" class="label">Native app · one Go helper · explicit permission and approval boundaries</text>
  <rect class="boundary" x="25" y="190" width="990" height="575" rx="16"/>
  <text x="45" y="219" class="label">Limmr on your Mac</text>
  <rect class="box" x="50" y="100" width="280" height="70" rx="10"/>
  <text x="190" y="129" text-anchor="middle">Remote AI clients</text>
  <text x="190" y="153" text-anchor="middle" class="label">HTTPS · OAuth + PKCE</text>
  <rect class="box" x="390" y="100" width="280" height="70" rx="10"/>
  <text x="530" y="129" text-anchor="middle">Local AI clients</text>
  <text x="530" y="153" text-anchor="middle" class="label">Same Mac · per-agent bearer</text>
  <rect class="box" x="725" y="100" width="265" height="70" rx="10"/>
  <text x="857" y="141" text-anchor="middle">WhatsApp service</text>
  <path class="wire" d="M 190 170 V 245"/>
  <path class="wire" d="M 530 170 V 245"/>
  <rect class="box" x="50" y="245" width="280" height="75" rx="10"/>
  <text x="190" y="274" text-anchor="middle">Remote MCP · 127.0.0.1:18801</text>
  <text x="190" y="299" text-anchor="middle" class="label">Via Funnel or your HTTPS proxy</text>
  <rect class="box" x="390" y="245" width="280" height="75" rx="10"/>
  <text x="530" y="274" text-anchor="middle">Local MCP · 127.0.0.1:18800</text>
  <text x="530" y="299" text-anchor="middle" class="label">/mcp · no browser Origin</text>
  <rect class="box" x="725" y="245" width="265" height="75" rx="10"/>
  <text x="857" y="274" text-anchor="middle">SwiftUI app</text>
  <text x="857" y="299" text-anchor="middle" class="label">Review · edit · approve or deny</text>
  <path class="wire" d="M 190 320 V 360 H 280 V 390"/>
  <path class="wire" d="M 530 320 V 360 H 440 V 390"/>
  <path class="wire" d="M 857 320 V 390"/>
  <rect class="box" x="50" y="390" width="620" height="100" rx="10"/>
  <text x="360" y="422" text-anchor="middle" class="heading">Go engine</text>
  <text x="360" y="450" text-anchor="middle">Agent identity → capability → chat scope → hidden list</text>
  <text x="360" y="475" text-anchor="middle" class="label">Reads return permitted data; sends create pending approvals</text>
  <rect class="box" x="725" y="390" width="265" height="100" rx="10"/>
  <text x="857" y="422" text-anchor="middle">Control API · :18800/v1/…</text>
  <text x="857" y="450" text-anchor="middle" class="label">Admin credential</text>
  <text x="857" y="475" text-anchor="middle" class="label">Not exposed by the tunnel</text>
  <path class="wire" d="M 725 440 H 670"/>
  <path class="wire" d="M 360 490 V 535"/>
  <rect class="box" x="50" y="535" width="620" height="75" rx="10"/>
  <text x="360" y="565" text-anchor="middle">Local stores</text>
  <text x="360" y="591" text-anchor="middle" class="label">session.db · messages.db · hub.db · bounded operational logs</text>
  <path class="wire" d="M 670 470 H 700 V 680 H 725"/>
  <text x="465" y="652" class="label">Only after your approval</text>
  <rect class="box" x="725" y="645" width="265" height="75" rx="10"/>
  <text x="857" y="675" text-anchor="middle">Messenger interface</text>
  <text x="857" y="700" text-anchor="middle" class="label">whatsmeow · fake in tests</text>
  <path class="wire" d="M 990 682 H 1002 V 135 H 990"/>
  <text x="50" y="739" class="label">The app can close while the helper runs. No agent can approve its own send.</text>
</svg>
