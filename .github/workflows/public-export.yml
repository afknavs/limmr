name: Public source candidate audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/release/public-export*'
      - '.github/workflows/public-export.yml'
      - 'docs/**'
      - 'app/**'
      - 'engine/**'
      - 'integrations/**'
      - '*.md'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test exporter against invented fixtures
        run: python3 scripts/release/public-export-test.py
      - name: Prepare and audit local candidate
        run: scripts/release/public-export.sh "$RUNNER_TEMP/limmr-public-candidate"
      # Deliberately no artifact upload, publishing, signing or deployment.
